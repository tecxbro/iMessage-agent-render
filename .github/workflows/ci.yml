name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/render-docs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:chaos
      - run: npm run build
      - run: npm run docs:check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Render Blueprint against the official schema
        run: |
          python -m pip install check-jsonschema==0.38.0
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
