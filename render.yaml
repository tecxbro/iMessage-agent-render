# Render Blueprint — one Web Service for the Photon Spectrum webhook agent.
# https://render.com/docs/blueprint-spec
# https://render.com/docs/configure-environment-variables
# https://render.com/docs/web-services
services:
  - type: web
    name: photon-agent
    runtime: node
    # Recommended for Deploy-to-Render templates so forks aren't redeployed on every upstream push.
    # https://render.com/docs/deploy-to-render
    autoDeployTrigger: "off"
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Photon project credentials — prompted during Blueprint create (never commit secrets).
      # https://photon.codes/docs/spectrum-ts/getting-started
      - key: SPECTRUM_PROJECT_ID
        sync: false
      - key: SPECTRUM_PROJECT_SECRET
        sync: false
      # Signing secret returned once when you register the webhook URL with Photon.
      # https://photon.codes/docs/spectrum-ts/webhooks
      # https://photon.codes/docs/webhooks/managing-webhooks
      - key: SPECTRUM_WEBHOOK_SECRET
        sync: false
