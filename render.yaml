# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# One paid Web Service is intentional: the attached disk makes v1 single-instance.
services:
  - type: web
    name: imessage-codex-agent
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    # NODE_ENV=production makes npm omit devDependencies by default, but the
    # TypeScript build and pre-deploy migration require the pinned dev tools.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    # Render rejects custom shutdown delays on services with a persistent disk.
    disk:
      name: codex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Fixed application/runtime values supplied by this Blueprint.
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production

      # Supplied automatically by the attached Render PostgreSQL database.
      # Never replace this with a copied connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: imessage-agent-db
          property: connectionString

      # Persistent-disk paths and the default authentication mode.
      - key: CODEX_HOME
        value: /var/data/codex
      - key: AGENT_WORKSPACE_ROOT
        value: /var/data/workspaces
      - key: CODEX_AUTH_MODE
        value: chatgpt

      # Enter these during initial Blueprint creation.
      - key: SPECTRUM_PROJECT_ID
        sync: false
      - key: SPECTRUM_PROJECT_SECRET
        sync: false
      # Required app-level sender allowlist; this is separate from Spectrum line setup.
      - key: AGENT_OWNER_HANDLES
        sync: false

      # Optional. Leave blank to run without semantic memory.
      - key: SUPERMEMORY_API_KEY
        sync: false

      # Generated by Render and never stored in this file.
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: imessage-agent-db
    databaseName: imessage_agent
    user: imessage_agent
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    diskSizeGB: 15
    connectionPool: none
    ipAllowList: []
